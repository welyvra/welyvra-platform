name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. No secrets are used, and pull_request_target is never used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: welyvra
          POSTGRES_PASSWORD: welyvra
          POSTGRES_DB: welyvra
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U welyvra"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Throwaway CI database. Database tests fail (never skip) without it.
      DATABASE_URL: postgres://welyvra:welyvra@localhost:54329/welyvra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
