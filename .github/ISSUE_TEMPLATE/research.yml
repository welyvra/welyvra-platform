name: Research spike
description: Time-boxed investigation that ends in a written finding or ADR
labels: ['type:research']
body:
  - type: textarea
    id: question
    attributes: { label: Questions to answer }
    validations: { required: true }
  - type: textarea
    id: method
    attributes: { label: Method, description: Sources to read, experiments to run. }
    validations: { required: true }
  - type: textarea
    id: output
    attributes: { label: Expected output, description: 'e.g. docs page, ADR, fixtures.' }
    validations: { required: true }
  - type: input
    id: timebox
    attributes: { label: Time box }
